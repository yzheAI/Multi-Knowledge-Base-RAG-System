# 一组容器服务
services:

  rag-api:
    # 使用当前目录的 Dockerfile 构建镜像
    build: .

    container_name: ai-rag

    ports:
      - "8000:8000"

    # 宿主机路径 : 容器内路径
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # 环境变量注入容器
    env_file:
      - .env

    depends_on:
      - mysql
      - redis

    restart: always

  mysql:
    image: mysql:8.0
    container_name: ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always

  redis:
    image: redis:7
    container_name: ai-redis
    volumes:
      - redis_data:/data
    restart: always

volumes:
  mysql_data:
  redis_data: